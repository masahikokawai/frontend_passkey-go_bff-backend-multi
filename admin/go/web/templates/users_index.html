{{define "pages/users_index"}}
<h1>ユーザー管理</h1>
<p class="text-muted">
  新規作成できるのはローカル認証ユーザーのみ(<code>/login</code>・<code>/login/rsa</code>でログイン可能になる)。
  Keycloak経由のユーザーは初回ログイン時に自動作成されるため、ここでは作成できない。
</p>

<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>名前</th>
      <th>email</th>
      <th>パスキー</th>
      <th>role</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {{range .Users}}
    <tr>
      <td>{{.ID}}</td>
      <td>{{.Name}}</td>
      <td>{{.Email}}</td>
      <td>
        {{if .HasPasskey}}<span class="text-success">✅ 登録済み</span>{{else}}<span class="text-muted">未登録</span>{{end}}
      </td>
      <td>
        <form method="post" action="/users/{{.ID}}/role" class="form-inline">
          <select name="role" class="form-control form-control-sm mr-2">
            <option value="general" {{if eq .Role "general"}}selected{{end}}>general</option>
            <option value="management" {{if eq .Role "management"}}selected{{end}}>management</option>
          </select>
          <button type="submit" class="btn btn-sm btn-outline-primary">変更</button>
        </form>
      </td>
      <td>
        <form method="post" action="/users/{{.ID}}/delete" onsubmit="return confirm('このユーザーを削除しますか?');">
          <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>

<h2 class="mt-4">ローカル認証ユーザーの新規作成</h2>
<!-- 【e2e監査で判明・修正】label に for が無く、対応する input に id も無いため、
     スクリーンリーダー等の支援技術がラベルと入力欄の関連を認識できないアクセシビリティ不備があった。
     for/id を対応させることで、支援技術だけでなく Playwright の getByLabel 等の
     「ラベルで要素を探す」操作にも正しく応答できるようになる -->
<form method="post" action="/users" class="mt-3">
  <div class="form-group">
    <label for="user-new-name">名前</label>
    <input id="user-new-name" type="text" name="name" class="form-control" required>
  </div>
  <div class="form-group">
    <label for="user-new-email">email</label>
    <input id="user-new-email" type="email" name="email" class="form-control" required>
  </div>
  <div class="form-group">
    <label for="user-new-password">パスワード</label>
    <input id="user-new-password" type="password" name="password" class="form-control" required>
  </div>
  <div class="form-group">
    <label for="user-new-role">role</label>
    <select id="user-new-role" name="role" class="form-control">
      <option value="general">general</option>
      <option value="management">management</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary">作成</button>
</form>
{{end}}
