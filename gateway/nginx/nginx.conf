# 外部公開APIゲートウェイ(nginx製)
# CONTRACT.mdセクション20.7・20.8参照
#
# gateway/go(アプリケーションコード内で flag をポーリングして都度ルーティング先を決めるGo実装)との対比として、
# 「nginx自体は静的な設定しか持てない → 外部のサイドカーが設定ファイルを書き換えてreloadする」
# という、実務でもよくある構成をここで再現する
#
# システムのnginx(brew services)とは独立させるため、
# 必ず`nginx -p <このディレクトリ> -c nginx.conf` のようにprefixを明示して起動すること(start.shがこれを行う)
# pid/ログ/一時ファイルは全てこのディレクトリ配下(相対パス)に置く

worker_processes 1;
pid run/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 256;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log logs/access.log;

    client_body_temp_path run/client_body_temp;
    proxy_temp_path       run/proxy_temp;

    # backend.task-languageの現在値に応じたルーティング先
    # サイドカー(sidecar/)がbackend.task-languageをポーリングし、値が変わったら
    # このファイルを書き換えて`nginx -s reload`をトリガーする(このファイル自体はGit管理下に置き、
    # 既定値(go, :8097)を初期状態としてコミットしておく)
    include upstream.conf;

    # swagger-ui(:18080)の「Try it out」機能だけがブラウザから直接この
    # ゲートウェイ(:8081)へfetchするため、CORSヘッダが必要
    # (Client Credentials Grantのサーバー間クライアントはブラウザではないため
    # Same-Origin Policy自体の対象外で、CORSヘッダを必要としない)
    #
    # 【テスト監査で発見・追記】gateway/go(アプリケーション実装)側には元々CORSの
    # 仕組みが一切無く、実際のブラウザ上でだけ「Try it out」がCORSエラーで失敗する状態だった
    # (curlでの動作確認では気づけない)。両ゲートウェイ実装を比較する目的上、
    # gateway/go側で追加したCORS対応と同じ許可オリジン・挙動をここにも揃える
    map $http_origin $cors_allow_origin {
        default "";
        "http://localhost:18080" "http://localhost:18080";
    }

    server {
        listen 8081;

        location / {
            add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            # プリフライト(OPTIONS)は上流(backend外部API)へ転送せずここで直接応答する
            # (backend外部APIのルーターはOPTIONSメソッドのルートを持たないため、
            # 転送すると404/405になりプリフライト自体が失敗する。gateway/goと同じ設計)
            if ($request_method = OPTIONS) {
                add_header 'Content-Length' 0 always;
                return 204;
            }

            proxy_pass http://backend_external;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Client Credentials GrantのAuthorizationヘッダ等はproxy_passで自動的にそのまま転送される
            # 認証検証はここでは行わず、実際に応答するbackend側(RequireExternalClientAuth)に委譲する(gateway/goと同じ設計方針)
        }
    }
}
