[package]
name = "backend-rust"
version = "0.1.0"
edition = "2021"
# CONTRACT.mdセクション20: backend(Go)と同じTask CRUDワイヤー契約(REST/gRPC)をRustで実装する

[[bin]]
name = "backend-rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
