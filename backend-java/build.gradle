plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.bffgin'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

ext {
    grpcVersion = '1.68.1'
    protobufVersion = '4.26.1'
    javalinVersion = '6.3.0'
    jjwtVersion = '0.12.6'
}

sourceSets {
    integrationTest {
        java {
            srcDir 'src/integrationTest/java'
        }
        resources {
            srcDir 'src/integrationTest/resources'
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // --- HTTP(REST v1): Javalin、明示的なルート登録のみ、DIコンテナ無し ---
    implementation "io.javalin:javalin:${javalinVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.1'

    // --- gRPC v2: grpc-java(生成スタブをそのまま使う) ---
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // --- DB: 生JDBC + PreparedStatement(ORM禁止方針)、コネクションプールはHikariCP ---
    implementation 'com.mysql:mysql-connector-j:9.1.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // --- JWT: 成熟したライブラリを使う(C/C++はOpenSSL自前実装だったが、
    // それはCにまともなライブラリが無いという制約による選択であり、Javaには
    // 成熟したライブラリがあるためGo/Rust/JS/TSと同じ判断にする) ---
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // --- テスト ---
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    integrationTestImplementation "io.grpc:grpc-testing:${grpcVersion}"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'proto'
        }
    }
}

application {
    mainClass = 'com.bffgin.backend.Main'
}

test {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = '実DB(docker-compose上のMySQL)に接続する結合テスト。デフォルトのtestタスクには含めない'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}

tasks.named('compileJava') {
    dependsOn 'generateProto'
}
